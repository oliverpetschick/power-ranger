[package]
name = "power_ranger"
version = "0.1.0"
edition = "2021"

[features]
# Fake meter data, for UI work without the B23 wired.
sim = []

[dependencies]
pr_core = { path = "../core" }
esp-idf-svc = "0.51"
log = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmodbus = "0.12"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
